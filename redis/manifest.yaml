apiversion: v1
kind: services
metadata:
   name: redis
   namespace: redis
spec:
 selector:
   project: roboshop
   component: redis
   tier: db
   imagepullpolicy: always
ports:
    - protocol: tcp
      port: 6379 #services port
      targetport: 6379  #containers port
---
apiversion: v1
kind: services
metadata:
   name: redis-headless
   namespace: redis
spec:
 clusterip: None
 selector:
   project: roboshop
   component: redis
   tier: db
   imagepullpolicy: always
ports:
    - protocol: tcp
      port: 6379 #services port
      targetport: 6379  #containers port   

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: roboshop
spec:
  selector:
    matchLabels:
      project: roboshop
      component: redis
      tier: db
  serviceName: "redis-headless"
  replicas: 2 # by default is 1
  template:
    metadata:
      labels:
      project: roboshop
      component: redis
      tier: db
    spec:
      containers:
      - name: redis
        image: pullfrom dockerhub
        volumeMounts:
        - name: redis
          mountPath: /data
  #This is PVC
  volumeClaimTemplates:
  - metadata:
      name: redis
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi             