apiversion: v1
kind: configmap
metadata:
  name: frontend
  namespace: roboshop
data:
 MONGO: "true"
 REDIS_URL: "redis://redis:6379"
 MONGO_URL: "mongodb://mongodb:27017/frontend"
---
apiversion: app/v1
kind: Deployment
metadata:
 name: frontend
 namespace: roboshop
 #this labels are replecaset labels
 labels:
   project: roboshop
   component: frontend
   tier: frontend
spec:
 replicas: 1
 selector:
 # this lablels used to  select the pods
  matchlabels:
   project: roboshop
   component: frontend
   tier: frontend
   imagepullpolicy: always
   envfrom:
    - configmapref:
        name: frontend
   #pod defention
  templects:
    metadata:
      labels:
      project: roboshop
      component: frontend
      tier: frontend
    spec:
      containers:
      - name: frontend
        image: pullfrom dockerhub
      ports:
      - name: liveness-port
        containerport: 8080  
      resources:  
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "100m"  

      rednessProbe:
          httpget:
            path: /helth
            port: liveness-port

      livenessProbe:
          httpget:
            path: /helth
            port: liveness-port   
      volumeMounts:
         - name: nginx-config
           mountpath: /etc/nginx/nginx.conf
           subpath: nginx.conf    

      volumes:      
        - name: nginx-config
          configmap:
          name: frontend      

---
apiversion: v1
kind: services
metadata:
   name: frontend
   namespace: frontend
spec:
 selector:
   project: roboshop
   component: frontend
   tier: frontend
ports:
    - protocol: tcp
      port: 8080 #services port
      targetport: 8080  #containers port
---
apiversion: autoscaling/v2  
kind: HorizontalPodAutoscaler
metadata:
 name: frontend
labels:
    project: roboshop
    component: frontend
    tier: frontend  
spec:
 scaleTargetRef:
   apiVersion: app/v1
   kind: Deployment
   name: frontend
 minReplicas: 1
 maxReplicas: 10
 metrics:
 - type: Resource
   resource:
     name: cpu
     target:
       type: Utilization
       averageUtilization: 5 # in projects up to 70 we can give

        